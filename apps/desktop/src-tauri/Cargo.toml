[package]
name = "uwufiles-desktop"
description = "UwUFiles desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "uwufiles_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uwufiles-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# protocol-asset: picture previews load straight from disk (asset://), no
# base64 round trip through the IPC.
tauri = { version = "2", features = ["protocol-asset"] }
# Opening a file in its default app, from Rust only.
tauri-plugin-opener = "2"
# The window follows the folder: a file that appears or goes away elsewhere
# shows up here without pressing F5.
notify = "8"

# "Open folder" from another app while UwUFiles runs: the second start hands
# its folder to the first window and quits.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
