[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUFiles"
rust-version = "1.82"

[workspace.dependencies]
uwufiles-core = { path = "crates/uwufiles-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
