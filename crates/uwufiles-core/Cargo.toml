[package]
name = "uwufiles-core"
description = "What UwUFiles does to the file system: listing folders, copying, moving, renaming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
# The user's own folders (Dokumente, Bilder …) in the language of the system.
dirs = "6"
# Deleting goes to the trash, never a hard delete.
trash = "5"

# Network shares on KDE: kio-fuse is asked over D-Bus to mount an smb:// URL.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# The smbclient credentials file, readable by this user only.
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
